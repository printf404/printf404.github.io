<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — not found (but here's a game)</title>
<style>
:root {
  --bg:#0c0c0e; --fg:#e8e8ea; --dim:#8a8a92; --accent:#4cc9f0; --bad:#ff5d6c; --line:#1d1d22;
  --mono:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;
  --sans:'Inter','PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/* 顶部状态栏 */
.bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:.85rem;color:var(--dim);
}
.bar .left{display:flex;gap:18px;align-items:center;}
.bar .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.bar a{color:var(--dim);text-decoration:none;}
.bar a:hover{color:var(--accent);}

/* 游戏区 */
#game-wrap{flex:1;position:relative;}
canvas#game{display:block;width:100%;height:100%;}

/* 覆盖层（开始/结束） */
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
  background:rgba(12,12,14,.82);backdrop-filter:blur(6px);
  z-index:10;text-align:center;padding:20px;
}
.overlay h1{font-family:var(--mono);font-size:clamp(1.4rem,4vw,2.2rem);font-weight:500;}
.overlay h1 .code{color:var(--accent);}
.overlay p{color:var(--dim);max-width:48ch;font-size:.95rem;line-height:1.7;}
.overlay button{
  font-family:var(--mono);font-size:1rem;padding:12px 32px;
  background:transparent;color:var(--accent);border:1px solid var(--accent);
  border-radius:4px;cursor:pointer;letter-spacing:1px;transition:all .2s;
}
.overlay button:hover{background:rgba(76,201,240,.1);box-shadow:0 0 20px rgba(76,201,240,.3);}

/* 底部提示 */
.hint{
  padding:10px 24px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.78rem;color:var(--dim);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
}

.hidden{display:none;}
</style>
</head>
<body>

<div class="bar">
  <div class="left">
    <span class="dot"></span>
    <span>404.html</span>
  </div>
  <div>
    score: <span id="score" style="color:var(--accent);font-family:var(--mono);">0</span>
    &nbsp;·&nbsp;
    lives: <span id="lives" style="color:var(--bad);font-family:var(--mono);">❤❤❤</span>
  </div>
  <div><a href="/">← back home</a></div>
</div>

<div id="game-wrap">
  <canvas id="game"></canvas>

  <div class="overlay" id="start-screen">
    <h1><span class="code">404</span> · page not found</h1>
    <p>既然页面丢了，不如先玩一会儿。<br>左右移动接住蓝色方块，躲开红色圆球。活下去，直到你想回去。</p>
    <button id="start-btn">▶ start</button>
    <p style="font-size:.82rem;color:#555;">← → 方向键 / A D 键 / 鼠标移动</p>
  </div>

  <div class="overlay hidden" id="end-screen">
    <h1>game <span class="code">over</span></h1>
    <p>最终得分：<span id="final-score" style="color:var(--accent);font-family:var(--mono);">0</span></p>
    <button id="restart-btn">↻ retry</button>
    <p style="font-size:.82rem;color:#555;"><a href="/" style="color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--dim);">← 或者回主页</a></p>
  </div>
</div>

<div class="hint">
  <span>// 这个 404 页面是会动的</span>
  <span>made with canvas · no tracking, no cookies</span>
</div>

<script>
/* ========== Canvas 基础 ========== */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W, H;
function resize(){ W=cvs.width=innerWidth; H=cvs.height=cvs.parentElement.clientHeight; }
resize(); addEventListener('resize', resize);

/* ========== 游戏状态 ========== */
const state = {
  running:false, score:0, lives:3,
  player:{x:0,y:0,w:70,h:14},
  items:[], hazards:[], particles:[], spawns:0,
};

/* ========== 输入 ========== */
const keys = {};
addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e=>{ keys[e.key]=false; });
cvs.addEventListener('mousemove', e=>{
  const r=cvs.getBoundingClientRect();
  state.player.x = e.clientX - r.left - state.player.w/2;
});

/* ========== 工具 ========== */
function rand(a,b){return Math.random()*(b-a)+a;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

/* ========== 实体 ========== */
function spawnItem(){
  state.items.push({x:rand(10,W-30),y:-20,r:9,vy:rand(2.2,4.5),type:Math.random()<0.7?'good':'bonus'});
}
function spawnHazard(){
  state.hazards.push({x:rand(10,W-26),y:-20,r:13,vy:rand(3,5.5)});
}
function emitParticles(x,y,color,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rand(1,4);
    state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rand(1,2.5),color});
  }
}

/* ========== 重置 ========== */
function reset(){
  state.score=0; state.lives=3; state.items=[]; state.hazards=[]; state.particles=[]; state.spawns=0;
  state.player.x=W/2-state.player.w/2; state.player.y=H-50;
  updateHUD();
}

/* ========== HUD ========== */
function updateHUD(){
  document.getElementById('score').textContent=state.score;
  document.getElementById('lives').textContent='❤'.repeat(state.lives)+'🤍'.repeat(3-state.lives);
}

/* ========== 主循环 ========== */
let last=0, accum=0;
function frame(t){
  const dt = Math.min((t-last)/1000, 0.05); last=t;
  if(state.running){ accum+=dt; update(dt, accum); }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function update(dt, time){
  /* 玩家移动 */
  const spd = 320;
  if(keys['ArrowLeft']||keys['a']||keys['A']) state.player.x-=spd*dt;
  if(keys['ArrowRight']||keys['d']||keys['D']) state.player.x+=spd*dt;
  state.player.x = clamp(state.player.x, 4, W-state.player.w-4);
  state.player.y = H-50;

  /* 生成节奏随得分加快 */
  const rate = Math.max(0.6, 1.6 - state.score*0.025);
  if(time>state.spawns+rate){ state.spawns=time; if(Math.random()<0.7)spawnItem(); else spawnHazard(); }

  /* 物品 */
  state.items.forEach(it=>it.y+=it.vy*(1+state.score*0.01));
  state.hazards.forEach(h=>h.y+=h.vy*(1+state.score*0.015));

  /* 碰撞 - 玩家矩形 */
  const px=state.player.x, py=state.player.y, pw=state.player.w, ph=state.player.h;
  state.items = state.items.filter(it=>{
    if(it.y>it.r && it.y<py+ph && it.x>px-it.r && it.x<px+pw+it.r){
      if(it.type==='good'){ state.score+=10; emitParticles(it.x,it.y,'#4cc9f0'); }
      else { state.score+=30; emitParticles(it.x,it.y,'#cfeef7'); }
      updateHUD(); return false;
    }
    return it.y<H+30;
  });
  state.hazards = state.hazards.filter(h=>{
    if(h.y>h.r && h.y<py+ph && h.x>px-h.r && h.x<px+pw+h.r){
      state.lives--; updateHUD(); emitParticles(h.x,h.y,'#ff5d6c',18);
      if(state.lives<=0){ gameOver(); }
      return false;
    }
    return h.y<H+30;
  });

  /* 粒子 */
  state.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=dt*1.8;});
  state.particles = state.particles.filter(p=>p.life>0);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  /* 网格背景（淡） */
  ctx.strokeStyle='rgba(255,255,255,.03)';
  ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  if(!state.running){ return; }

  /* 玩家 - 极简横线 */
  const p=state.player;
  ctx.fillStyle='#e8e8ea';
  ctx.shadowColor='#4cc9f0'; ctx.shadowBlur=12;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.shadowBlur=0;

  /* 物品 */
  state.items.forEach(it=>{
    if(it.type==='good'){
      ctx.fillStyle='#4cc9f0'; ctx.shadowColor='#4cc9f0'; ctx.shadowBlur=10;
      ctx.fillRect(it.x-it.r, it.y-it.r, it.r*2, it.r*2);
    } else {
      ctx.strokeStyle='#cfeef7'; ctx.lineWidth=1.5; ctx.shadowColor='#cfeef7'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(it.x,it.y,it.r,0,Math.PI*2); ctx.stroke();
    }
    ctx.shadowBlur=0;
  });

  /* 危险物 */
  state.hazards.forEach(h=>{
    ctx.fillStyle='#ff5d6c'; ctx.shadowColor='#ff5d6c'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });

  /* 粒子 */
  state.particles.forEach(pt=>{
    ctx.globalAlpha=Math.max(pt.life,0); ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

/* ========== 开始 / 结束 ========== */
function startGame(){
  reset();
  state.running=true;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('end-screen').classList.add('hidden');
}
function gameOver(){
  state.running=false;
  document.getElementById('final-score').textContent=state.score;
  document.getElementById('end-screen').classList.remove('hidden');
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
</script>
</body>
</html>
